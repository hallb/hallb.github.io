<!doctype html>
<html lang="{{ site.LanguageCode | default "en-CA" }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · Ben Hall{{ end }}</title>
<meta name="color-scheme" content="light dark">
{{ with .Params.summary }}<meta name="description" content="{{ . }}">{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=Atkinson+Hyperlegible+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="{{ "site.css" | relURL }}">
<link rel="stylesheet" href="{{ "chroma-map.css" | relURL }}">
<script src="{{ "site.js" | relURL }}"></script>
{{ block "head" . }}{{ end }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

{{ partial "header.html" . }}

{{ block "main" . }}{{ end }}

{{ partial "footer.html" . }}
</body>
</html>
