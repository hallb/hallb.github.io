# Basic site configuration
baseURL = "https://benhall.ca/"
languageCode = "en-us"
title = "BenHall.ca"

# No theme. ISS-46 builds the design-system reference from layouts/ directly;
# the Stack theme and its submodule stay in the history but are not used here.

# Enable basic features
enableRobotsTXT = true
enableEmoji = true

# Output formats. JSON came from the Stack theme's search index; Pagefind
# replaces it (ISS-43), so nothing generates JSON for now.
[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]

# Chroma emits classes rather than inline styles, mapped in chroma-map.css.
# See docs/02-solution/syntax-highlighting.md in the planning repo.
[markup.highlight]
noClasses = false
lineNos = false
tabWidth = 2

[markup.tableOfContents]
startLevel = 2
endLevel = 2
ordered = true

# An image alone in a paragraph reaches the image hook as a block (.IsBlock),
# not wrapped in <p>. Both figure treatments emit <figure>, which is invalid
# inside <p>: the browser closes the paragraph early and leaves an empty one.
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

# Default language
defaultContentLanguage = "en"

# Configure taxonomies
[taxonomies]
tag = "tags"
category = "categories"

# Configure menu
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1
params = { icon = "home" }

[[menu.main]]
identifier = "about"
name = "About"
url = "/page/about/"
weight = 2
params = { icon = "user" }

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 3
params = { icon = "search" }

# Basic theme settings
[params]
# Home-B's heading. The wording is the design-system reference's
# (design-system/index.html), not yet signed off as the site's.
thesis = "The power of plain text."
thesisLine = "Plain text as the source of truth, at work and in life."
mainSections = ["post"]
# The byline's name on posts whose front matter has no author, which is every
# post from the archive.
author = "Ben Hall"
favicon = "/favicon.ico"

[params.sidebar]
subtitle = "Software, karate, kids, sailing, and cooking"

[params.sidebar.avatar]
enabled = true
local = true
src = "/img/avatar.png"

[params.sidebar.bio]
enabled = true
content = "Software engineer and Lead Technical Director at Electric Mind (formerly Intelliware) with expertise in Java and agile development methods."

[params.widgets]
homepage = [
    {type = "search", params = {placeholder = "Search..."}},
    {type = "archives"},
    {type = "tag-cloud"}
]
page = [
    {type = "search", params = {placeholder = "Search..."}},
    {type = "toc"}
]

# Social media links
[[params.socialIcons]]
name = "github"
url = "https://github.com/hallb"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com/BenHall"

